<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResumeForge Auto-Fill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">RF</div>
        <div class="brand-text">
          <span class="brand-name">ResumeForge</span>
          <span class="brand-sub">Auto-Fill</span>
        </div>
      </div>
      <button id="settings-toggle" class="icon-btn" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </header>

    <!-- Settings panel -->
    <div id="settings-panel" class="card settings-card hidden">
      <label class="field-label">API URL</label>
      <input type="text" id="api-url" class="input" placeholder="http://localhost:3000">
      <button id="save-settings" class="btn btn-sm">Save</button>
    </div>

    <!-- Connection status -->
    <div id="status-bar" class="status-bar">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Checking connection...</span>
    </div>

    <!-- Job selector card -->
    <div class="card">
      <label class="field-label">Select Job</label>
      <select id="job-select" class="input select">
        <option value="">Loading jobs...</option>
      </select>
      <div id="job-detail" class="job-detail hidden"></div>
      <div id="no-resume-warning" class="warning hidden">
        Generate a resume for this job first before auto-filling.
      </div>

      <button id="fill-btn" class="btn btn-primary" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
        </svg>
        Fill Application
      </button>
    </div>

    <!-- Capture card -->
    <div class="card capture-card">
      <label class="field-label">Capture Page</label>
      <div class="capture-btns">
        <button id="capture-job-btn" class="btn btn-capture">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 3H8l-2 4h12l-2-4z"/>
          </svg>
          Import Job
        </button>
        <button id="capture-article-btn" class="btn btn-capture">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
          </svg>
          Capture Article
        </button>
      </div>
      <div id="capture-result" class="capture-result hidden"></div>
    </div>

    <!-- Results -->
    <div id="results" class="card results-card hidden">
      <div class="results-header" id="results-header">Fill Complete</div>
      <div class="results-grid">
        <div class="stat">
          <span class="stat-value" id="filled-count">0</span>
          <span class="stat-label">Fields filled</span>
        </div>
        <div class="stat">
          <span class="stat-value stat-ai" id="ai-count">0</span>
          <span class="stat-label">AI answers</span>
        </div>
        <div class="stat">
          <span class="stat-value stat-warning" id="unresolved-count">0</span>
          <span class="stat-label">Still required</span>
        </div>
      </div>
      <div id="results-warning" class="results-warning hidden"></div>
      <div id="unresolved-list" class="unresolved-list hidden"></div>
      <div id="optional-miss-summary" class="optional-summary hidden"></div>
      <div id="optional-miss-list" class="unresolved-list optional-list hidden"></div>
      <p class="review-note">Review highlighted fields before submitting.</p>
    </div>

    <!-- Loading state -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <span>Filling form...</span>
    </div>

    <!-- Error state -->
    <div id="error-bar" class="error-bar hidden">
      <span id="error-text"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
